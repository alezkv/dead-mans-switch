name = "dms"
main = "src/index.ts"
compatibility_date = "2026-10-20"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "MONITOR"
class_name = "Monitor"

# The free plan accepts only SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Monitor"]

# The daily "monitor alive" message, at 08:00 UTC.
[triggers]
crons = ["0 8 * * *"]

# The checks are in the CHECKS secret, not here. See README.md.
