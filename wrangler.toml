name = "dms"
main = "src/index.ts"
compatibility_date = "2026-10-20"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "MONITOR"
class_name = "Monitor"

# The free plan accepts only SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Monitor"]

# No cron triggers. The empty list removes the old daily trigger from the live Worker.
[triggers]
crons = []

# The checks are in the CHECKS secret, not here. See README.md.
